apiVersion: v1
kind: Service
metadata:
  name: {{ include "opennof1.fullname" . }}-backend
  labels:
    {{- include "opennof1.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "opennof1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
